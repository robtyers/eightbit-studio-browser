MEMORY {
    P0: start = $A000, size = $2000, file = "basic0.bin", fill = yes, fillval = $EA;
    P1: start = $A000, size = $2000, file = "basic1.bin", fill = yes, fillval = $EA;
    P2: start = $A000, size = $2000, file = "basic2.bin", fill = yes, fillval = $EA;
    KR: start = $E000, size = $2000, file = "kernal.bin", fill = yes, fillval = $EA;
    CG: start = $D000, size = $1000, file = "characters.bin", fill = yes, fillval = $00;
}
SEGMENTS {
    PAGE0: load = P0, type = ro;
    PAGE1: load = P1, type = ro;
    PAGE2: load = P2, type = ro;
    CODE: load = KR, type = ro, start = $E000;
    GATES: load = KR, type = ro, start = $F800;
    RODATA: load = KR, type = ro, start = $F920;
    EDITOR: load = KR, type = ro, start = $FD00;
    JUMPS: load = KR, type = ro, start = $FF81;
    VECTORS: load = KR, type = ro, start = $FFFA;
    FONT: load = CG, type = ro;
}
